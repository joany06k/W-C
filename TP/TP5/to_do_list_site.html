<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mon TP5 - Todo List Alpine</title>
    <link rel="stylesheet" href="styles.css">
    
    <script defer src="script.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="monApplication()" :class="{ dark: modeSombre, dyslexie: modeDyslexie }">

    <h1>Todo List - TP5</h1>

    <div class="cadre">
        <h2>1. Thème et Lecture</h2>
        <button type="button" @click="changerSombre()" :aria-pressed="modeSombre ? 'true' : 'false'">
            Thème sombre : <span x-text="modeSombre ? 'activé' : 'désactivé'"></span>
        </button>
        <button type="button" @click="changerDyslexie()" :aria-pressed="modeDyslexie ? 'true' : 'false'">
            Lecture facilitée : <span x-text="modeDyslexie ? 'activée' : 'désactivée'"></span>
        </button>
    </div>

    <div class="cadre">
        <h2>2. Statistiques</h2>
        <ul>
            <li>Total des tâches : <span x-text="listeTaches.length"></span></li>
            <li>Tâches terminées : <span x-text="compterFaites()"></span></li>
            <li>Tâches à faire : <span x-text="listeTaches.length - compterFaites()"></span></li>
        </ul>
    </div>

    <div class="cadre">
        <h2>3. Ajouter une tâche</h2>
        
        <form @submit.prevent="ajouterTache()">
            <label for="nouvelleTache">Nouvelle tâche :</label>
            <input type="text" id="nouvelleTache" placeholder="Écrire ici..." x-model="texteSaisi">
            <button type="submit">Ajouter</button>
        </form>
    </div>

    <div class="cadre">
        <h2>4. Ma liste</h2>
        <p x-show="listeTaches.length === 0">La liste est complètement vide.</p>
        <ul>
            
            <template x-for="t in listeTaches" :key="t.id">
                <li>
                    <label>
                        <input type="checkbox" x-model="t.fini" @change="sauvegarderLocal()">
                        <span :class="{ barre: t.fini }" x-text="t.nom"></span>
                    </label>
                    <button type="button" @click="supprimer(t.id)" :aria-label="'Supprimer la tâche : ' + t.nom">Effacer</button>
                </li>
            </template>
        </ul>
    </div>
</body>
</html>
